#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "roundcube"
name = "Roundcube"
description.en = "Web interface to check your mailbox"
description.fr = "Interface web pour consulter votre boîte mail"

version = "1.7.6~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://roundcube.net/"
demo = "https://demo.yunohost.org/webmail/"
admindoc = "https://github.com/roundcube/roundcubemail/wiki"
code = "https://github.com/roundcube/roundcubemail"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = true

disk = "100M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/webmail"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["de_DE", "en_GB", "es_ES", "fr_FR", "it_IT", "pt_BR", "pt_PT"]
    default = "fr_FR"

    [install.with_carddav]
    ask.en = "Install CardDAV synchronization plugin?"
    ask.fr = "Installer le plugin de synchronisation CardDAV ?"
    type = "boolean"
    default = false

[resources]
    [resources.sources.main]
    url = "https://github.com/roundcube/roundcubemail/releases/download/1.7.6/roundcubemail-1.7.6.tar.gz"
    sha256 = "6934e8faed3c2c9321f948427655a958b80be4999f466b023029be5f2269f6ba"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "roundcubemail-\\d+\\.\\d+\\.\\d+\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "mariadb-server",
        "php8.6",
        "php8.6-ldap",
        "php8.6-mysql",
        "php8.6-cli",
        "php8.6-intl",
        "php8.6-zip",
        "php8.6-gd",
        "php8.6-mbstring",
        "php8.6-dom",
        "php8.6-curl"
    ]

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.11.1"
